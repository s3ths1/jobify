fail_fast: true

default_language_version:
  python: python3.14

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, pre-merge-commit, manual]

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, --verbose]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: debug-statements
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
              benchmarks/results.txt
          )$
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: |
          (?x)^(
              benchmarks/results.txt
          )$

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
        exclude: ^docs/CHANGELOG\.md$

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: [--toml, pyproject.toml, --count, --skip, "*.pyi,*.pyc"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

  - repo: https://github.com/semgrep/pre-commit
    rev: v1.182.1
    hooks:
      - id: semgrep
        args: ["scan", "--config", "auto", "--error", "src"]
        types: [python]
        pass_filenames: false
        require_serial: true
        verbose: true

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "src"]
        additional_dependencies: ["bandit[toml]"]
        pass_filenames: false

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --only-group lint ruff format --force-exclude
        language: system
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --only-group lint ruff check --force-exclude --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy
        entry: uv run --frozen --only-group lint mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: ty
        name: ty
        entry: uv run --frozen --only-group lint ty check
        language: system
        types: [python]
        pass_filenames: false
