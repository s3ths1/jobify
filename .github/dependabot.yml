version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      all-patch:
        patterns:
          - "*"
        update-types:
          - patch
      all-minor:
        patterns:
          - "*"
        update-types:
          - minor
      all-major:
        patterns:
          - "*"
        update-types:
          - major
    cooldown:
      default-days: 7
