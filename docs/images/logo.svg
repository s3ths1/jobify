<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" width="500" height="180" role="img" aria-labelledby="title desc">
  <title id="title">Jobify</title>
  <desc id="desc">Jobify icon and wordmark</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10262c"/>
      <stop offset="1" stop-color="#08141a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".20"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#287c78"/>
      <stop offset=".52" stop-color="#36b9a9"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="j" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#99f6e4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <style>
      .wordmark { fill: #0f766e; }
      @media (prefers-color-scheme: dark) {
        .wordmark { fill: #eaf2f8; }
      }
    </style>
  </defs>

  <svg x="8" y="8" width="164" height="164" viewBox="0 0 256 256" aria-hidden="true">
    <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#tile)"/>
    <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#glow)"/>
    <rect x="9" y="9" width="238" height="238" rx="59" fill="none" stroke="#5eead4" stroke-opacity=".18" stroke-width="2"/>

    <circle cx="128" cy="128" r="86" fill="none" stroke="url(#ring)" stroke-width="12" stroke-linecap="round" stroke-dasharray="460 80"/>
    <path d="M143 80 V146 C143 168 130 180 113 180 C98 180 89 171 87 158" fill="none" stroke="url(#j)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="188.81" cy="67.19" r="26" fill="url(#halo)"/>
    <circle cx="188.81" cy="67.19" r="11" fill="#fbbf24"/>
    <circle cx="185.81" cy="64.19" r="3.6" fill="#fff" fill-opacity=".55"/>
  </svg>

  <text class="wordmark" x="204" y="120" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="88" font-weight="700" letter-spacing="-3.5">Jobify</text>
</svg>
