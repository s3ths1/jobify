<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title desc">
  <title id="title">Jobify</title>
  <desc id="desc">A precise J monogram with a scheduled event marker at its start.</desc>

  <rect x="12" y="12" width="232" height="232" rx="52" fill="#101B2D"/>

  <!-- One continuous J: a task is registered, then carried through execution. -->
  <path d="M78 78H174V150C174 180 155 198 126 198C101 198 83 184 78 162"
        fill="none"
        stroke="#F4F7FB"
        stroke-width="17"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- The event marker sits on the registration point, not as decoration. -->
  <circle cx="174" cy="78" r="17" fill="#101B2D" stroke="#35D0B0" stroke-width="7"/>
  <circle cx="174" cy="78" r="5" fill="#35D0B0"/>
</svg>