<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title desc">
  <title id="title">Jobify</title>
  <desc id="desc">A bold J monogram built from a task queue, with a bright trigger dot.</desc>

  <rect x="12" y="12" width="232" height="232" rx="52" fill="#111827"/>

  <!-- Queued jobs resolve into one clear execution path. -->
  <g fill="none" stroke="#F8FAFC" stroke-width="14" stroke-linecap="round">
    <path d="M62 91H91"/>
    <path d="M62 126H91"/>
    <path d="M62 161H91"/>
    <path d="M91 77H174V150C174 175 156 191 130 191H113"/>
  </g>

  <!-- Trigger / scheduled event. -->
  <circle cx="174" cy="77" r="10" fill="#A3E635"/>
  <circle cx="174" cy="77" r="3" fill="#111827"/>
</svg>