# ============================================================================
#
# The configuration produced by default is meant to highlight the features
# that Zensical provides and to serve as a starting point for your own
# projects.
#
# ============================================================================
[project]
repo_name = "s3ths1/jobify"
repo_url = "https://github.com/s3ths1/jobify"
edit_uri = "edit/main/docs"
site_name = "jobify"
site_description = "A modern, lightweight and robust task manager with a user-friendly interface and a wide range of features, using the low-level asyncio API and more."
site_author = "Sergey Yavorsky"
site_url = "https://s3ths1.github.io/jobify"
copyright = "&copy; 2026 Sergey Yavorsky"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Quickstart" = "index.md" },
  { "Jobify settings" = "app_settings.md" },
  { "Task settings" = "task_settings.md" },
  { "Schedule" = "schedule.md" },
  { "Job" = "job.md" },
  { "Context" = "context.md" },
  { "Router" = "router.md" },
  { "Integrations" = "integrations.md" },
  { "Advanced Usage" = [
        "advanced_usage/exceptions.md",
        "advanced_usage/exception_handlers.md",
        "advanced_usage/system_time.md",
        "advanced_usage/queue.md",
        "advanced_usage/retry.md",
    ] },
  { "API Reference" = "api_reference/index.md" },
  { "Contributing" = "contributing.md" },
  { "Changelog" = "CHANGELOG.md" },
]

[project.plugins]
search = {}
[project.plugins.mkdocstrings]
handlers = { python = { paths = ["src"] } }

# ----------------------------------------------------------------------------
[project.theme]
variant = "modern"
language = "en"
logo = "images/logo.svg"
favicon = "images/favicon.svg"

features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "search.suggest",
  "toc.follow",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"

# ----------------------------------------------------------------------------
[[project.theme.palette]]
media = "(prefers-color-scheme)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# ----------------------------------------------------------------------------
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

# ----------------------------------------------------------------------------
# The "extra" section contains miscellaneous settings.
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/s3ths1/jobify"
name = "Jobify on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/telegram"
link = "https://t.me/jobify_community"
name = "Jobify Telegram Community"
